version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # react/react-dom must stay pinned to the version @raycast/api ships
      - dependency-name: react-dom
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
